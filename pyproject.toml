[project]
name = "core"
version = "0.1.0"
description = "A multi-agent chatbot featuring LangGraph orchestration, FastAPI streaming, and MCP tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langgraph>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp[cli]>=1.0.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.0",
    "langchain-openai>=1.3.3",
]

