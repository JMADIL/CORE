services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: core-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/sessions.sqlite3
    volumes:
      - core-data:/app/data
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_PROXY_URL=http://backend:8000
    container_name: core-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - core-network

networks:
  core-network:
    driver: bridge

volumes:
  core-data:
